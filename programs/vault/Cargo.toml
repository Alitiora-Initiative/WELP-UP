[package]
name = "welp-vault"
version = "0.1.0"
description = "WELP UP! per-user PDA vault (devnet scaffold — mainnet disabled)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "welp_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("anchor-debug", "anchor-no-log-cpi-calls", "anchor-program", "custom-heap", "custom-panic"))',
  'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
welp-vault-checks = { path = "../vault-checks" }
pyth-solana-receiver-sdk = "0.4.0"
