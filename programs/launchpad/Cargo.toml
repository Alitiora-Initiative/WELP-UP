[package]
name = "welp-launchpad"
version = "0.1.0"
description = "WELP launchpad and epoch-locked treasury program; local-test scaffold only"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "welp_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
program-test = [
  "dep:solana-program-test",
  "dep:solana-banks-client",
  "dep:solana-sdk",
  "dep:tokio",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("anchor-debug", "anchor-no-log-cpi-calls", "anchor-program", "custom-heap", "custom-panic"))',
  'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang = { version = "=0.30.1" }
solana-program-test = { version = "=1.18.26", optional = true }
solana-banks-client = { version = "=1.18.26", optional = true }
solana-sdk = { version = "=1.18.26", optional = true }
tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread"], optional = true }

[[test]]
name = "treasury_program_test"
path = "tests/treasury_program_test.rs"
required-features = ["program-test"]
