name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Blueprint target: 3.14; using 3.13 until setup-python supports 3.14 stable
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  node-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Resolve patched transitive dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:notifications
      - run: npm run test:vault-client
      - run: npm run test:charts
      - run: npm run test:security
      - run: npm run test:agent
      - run: npm run test:program-gates
      - run: npm run test:market-scoring
      - run: npm run test:vercel-deploy-gate
      - run: npm run build
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/npm-audit.json"); console.log("Dependency audit summary:", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(name, "|", v.severity, "| range:", v.range, "| fix:", JSON.stringify(v.fixAvailable), "| advisories:", (v.via ?? []).map(x => typeof x === "string" ? x : x.title).join("; "));'
      - name: Audit for moderate or higher vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Commit refreshed dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile already matches package overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): lock patched minimatch security fix"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_BRANCH}"

  rust-checks:
    name: Rust checks (vault crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{runner.os}}-cargo-registry-${{hashFiles('**/Cargo.lock')}}
          restore-keys: |
            ${{runner.os}}-cargo-registry-
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            programs/vault/target
          key: ${{runner.os}}-cargo-target-${{hashFiles('**/Cargo.lock')}}
          restore-keys: |
            ${{runner.os}}-cargo-target-
      - name: Check formatting — vault-checks
        run: cargo fmt --check --manifest-path programs/vault-checks/Cargo.toml
      - name: Check formatting — vault program
        run: cargo fmt --check --manifest-path programs/vault/Cargo.toml
      - name: Clippy — vault-checks
        run: cargo clippy --manifest-path programs/vault-checks/Cargo.toml -- -D warnings
      - name: Clippy — vault program
        run: cargo clippy --manifest-path programs/vault/Cargo.toml -- -D warnings
      - name: Unit tests — vault-checks
        run: cargo test --manifest-path programs/vault-checks/Cargo.toml
